[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mptpro"
version = "0.1.0"
description = "Production layer on top of MoneyPrinterTurbo: series planning, local AI b-roll, captions, QA gate, YouTube publishing."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
mptpro = "mptpro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mptpro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
